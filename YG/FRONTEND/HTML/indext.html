<!DOCTYPE html>

    <title>Time table</title>
    <style>
        .background-color {
            background-color: rgb(255, 106, 0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        table {

            background-color: rgb(0, 200, 255);
            border: 2px solid black;
            text-align: center;
            border-radius: 5px;
            box-shadow: -10px -10px 5px 1px gray;

        }
        .head{
            text-align: top;
        }

        th, td{

        padding: 10px;
        }

        th{

        }
    </style>
</head>
