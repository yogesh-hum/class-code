<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF-esle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
        }

        .list {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 300px;
        }

        button {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>

    Enter your Number:<input type="number" id="number">
    <button onclick="Checkno()">Check</button>

    <script>
        const no = document.getElementById("number");
        function Checkno() {
            console.log(no);
            if (no.value == 0) {
                console.log(no.value, "is neither even nor odd");
            }
            else if (no.value % 2 == 0) {
                console.log(no.value, "is an even number")
            }
            else {
                console.log(no.value, "is an odd number");
            }
        }
    </script>
</body>

</html>
